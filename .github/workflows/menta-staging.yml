name: Menta staging assembler
on:
  push:
    branches: [menta-vercel-staging-20260906]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: menta-vercel-staging-20260906
      - name: Assemble self-contained loader
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 11); do test -f "menta-staging/p${n}.js" || exit 0; done
          test -f menta-staging/boot.js || exit 0
          {
            printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menta</title></head><body><div id="loading" style="font:16px system-ui;padding:40px">Menta…</div>'
            for n in $(seq 1 11); do printf '<script>'; cat "menta-staging/p${n}.js"; printf '</script>\n'; done
            printf '<script>'; cat menta-staging/boot.js; printf '</script></body></html>\n'
          } > menta.html
          test "$(wc -c < menta.html)" -gt 70000
      - name: Commit assembled bundle
        shell: bash
        run: |
          if [ ! -f menta.html ]; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add menta.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Assemble Menta staging bundle'
          git push
