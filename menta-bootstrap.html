<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Menta</title><style>*{box-sizing:border-box}body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7f2;color:#17211b;min-height:100vh;display:grid;place-items:center}.card{width:min(92vw,430px);padding:32px;border:1px solid #dce2da;border-radius:24px;background:rgba(255,255,255,.86);box-shadow:0 18px 60px rgba(20,35,25,.08);text-align:center}.mark{width:52px;height:52px;margin:0 auto 18px;border-radius:17px;background:#8dd8b0;display:grid;place-items:center;font-weight:800;font-size:22px}.bar{height:8px;border-radius:99px;background:#e6ebe5;overflow:hidden;margin-top:22px}.bar:after{content:"";display:block;width:42%;height:100%;border-radius:inherit;background:#5bb88a;animation:load 1.1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(135%)}}p{line-height:1.5;color:#59655e}.error{color:#a43939;white-space:pre-wrap;font-size:14px}@media(prefers-color-scheme:dark){body{background:#101511;color:#edf3ee}.card{background:#18201a;border-color:#2a352d}p{color:#acb8b0}.bar{background:#2a352d}}</style></head><body><main class="card"><div class="mark">M</div><h1>Menta</h1><p id="status">Sto preparando il tuo allenamento mentale…</p><div class="bar" id="bar"></div></main><script>const API='https://ep-noisy-shadow-arbwuaiw.apirest.c-4.us-west-2.aws.neon.tech/neondb/rest/v1/menta_bundle_chunks?version=eq.v1&select=seq,payload&order=seq.asc';async function gunzipBase64(b64){const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('Il browser non supporta la decompressione richiesta.');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(stream).text()}async function boot(){const status=document.getElementById('status');try{status.textContent='Caricamento di Menta…';const res=await fetch(API,{headers:{Accept:'application/json'}});if(!res.ok)throw new Error('Backend '+res.status+' '+res.statusText);const rows=await res.json();if(!Array.isArray(rows)||rows.length!==10)throw new Error('Bundle incompleto: '+(rows?.length??0)+' frammenti');rows.sort((a,b)=>a.seq-b.seq);const b64=rows.map(r=>r.payload).join('');if(b64.length!==73360)throw new Error('Bundle non valido: '+b64.length+' caratteri');status.textContent='Avvio dei giochi…';const html=await gunzipBase64(b64);document.open();document.write(html);document.close()}catch(err){document.getElementById('bar').style.display='none';status.className='error';status.textContent='Menta non è riuscita ad avviarsi.\n'+(err&&err.message?err.message:String(err));console.error(err)}}boot();</script></body></html>
